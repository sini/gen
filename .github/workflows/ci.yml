name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A negative test runs on a scratch branch with no pull request: `gh workflow run ci.yml --ref <branch>`.
  workflow_dispatch:

jobs:
  # The three-evaluator matrix (upstream Nix, Determinate, Lix) from gen-harness. The ref is the
  # gen-harness rev locked in ci/flake.lock, so one harness identity governs the run; `relock`
  # rewrites it when that lock moves. Its `fmt` job is the former `format` job (`nix fmt -- --ci`
  # in ci/), and each column runs what the former `checks` job ran, under its own evaluator.
  #
  # Validation: re-host byte-parity oracles (pure stack == frozen nixpkgs stack over the instance
  # key sets and every non-identity field). `id_hash` is the ADR-0016 excluded axis — no forward
  # golden pin can carry the new encoding, so it is held by a teeth arm on the PURE engine instead.
  evaluators:
    uses: sini/gen-harness/.github/workflows/evaluators.yml@e43e55b06bc69f8f74750ff45cfa42e8b516356c
    with:
      # `.` is the ROOT flake, the bare `nix flake check` every member repository runs. Its `roster`
      # output is what carries the check — forcing the roster to names depth reds on an unhealthy
      # member — and without this line that oracle is landed and never run (den-hoag-z5wsg).
      flake-checks: |
        .
        ./ci --keep-going
      # compose-parity's one cell whose green is an abort `tryEval` cannot catch, so it is read
      # across a process boundary, by each column's evaluator (ci/compose-parity.nix, `overflowPin`).
      # Green is the eval failing on a stack overflow; a value or any other error is red.
      extra-run: |
        if nix eval ./ci#lib.composeParity.overflowPin 2> overflow.err; then
          echo "compose-parity overflowPin evaluated to a value: the mutual same-tag cycle no longer overflows, or the overflow was caught" >&2
          exit 1
        fi
        grep -q 'stack overflow' overflow.err || { cat overflow.err >&2; exit 1; }

  # Performance: perf-regression gates on deterministic evaluator counters (parity at scale +
  # thunk/alloc ratios + linearity). cpu is reported but gated by nothing — see ci/README.md.
  perf-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix run ./ci#perf-bench

  # Reported, gated by nothing (den-hoag-6fmmb): the ADR-0006 sole-evaluator scan. A refusal is the
  # ruled property being TRUE of a tree, disposed of by an owner act — an exception entry or the
  # reading standing — so its red is cleared by a RULING and not by a fix, and a check of that kind
  # must not gate. It ran as a `checks` cell until 2026-09-13 and held this hub red for six days,
  # taking the signal of every cell beside it with it. It is an app rather than a passing check
  # because nix hides a builder's log at exit 0: the report must still be READ on every run.
  sole-evaluator-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix run ./ci#sole-evaluator-report

  # Trust surface: the cited fleet numbers still agree with their own arithmetic (pure jq over the
  # committed baselines — pin agreement + re-derivations + digest ties + floors; no fleet eval).
  fleet-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix run ./ci#fleet-consistency
