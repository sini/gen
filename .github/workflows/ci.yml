name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ci
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix fmt -- --ci

  # Validation: re-host byte-parity oracles (pure stack == frozen nixpkgs stack over the instance
  # key sets and every non-identity field). `id_hash` is the ADR-0016 excluded axis — no forward
  # golden pin can carry the new encoding, so it is held by a teeth arm on the PURE engine instead.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix flake check ./ci

  # Performance: perf-regression gates on deterministic evaluator counters (parity at scale +
  # thunk/alloc ratios + linearity). cpu is reported but gated by nothing — see ci/README.md.
  perf-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix run ./ci#perf-bench

  # Trust surface: the cited fleet numbers still agree with their own arithmetic (pure jq over the
  # committed baselines — pin agreement + re-derivations + digest ties + floors; no fleet eval).
  fleet-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix run ./ci#fleet-consistency
